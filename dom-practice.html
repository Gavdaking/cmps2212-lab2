<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOM Selection Practice</title>
</head>
<body>

  <h1 id="title">DOM Selection Lab</h1>

  <p class="info">Paragraph one</p>
  <p class="info">Paragraph two</p>
  <p class="info">Paragraph three</p>

  <div id="container">
    <button class="action-btn">Action 1</button>
    <button class="action-btn">Action 2</button>
    <button id="special-btn">Special</button>
  </div>

  <script defer>
    // Select title by ID
    const title = document.getElementById("title");
    if (!title) {
      console.error("Title element not found");
    } else {
      console.log("Title:", title);
    }

    // Select first paragraph with class "info"
    const firstInfo = document.querySelector(".info");
    if (!firstInfo) {
      console.error("Info paragraph not found");
    } else {
      console.log("First info paragraph:", firstInfo);
    }

    // Select all action buttons
    const actionButtons = document.querySelectorAll(".action-btn");
    if (actionButtons.length === 0) {
      console.error("No action buttons found");
    } else {
      console.log("Action buttons:", actionButtons);
    }
  </script>

</body>
</html>
